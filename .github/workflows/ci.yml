name: ConnSB CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: connsb-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    # Use an in-memory test database and dummy credentials.
    # Never supply the Aiven or real payment credentials to this workflow.
    env:
      DATABASE_URL: "jdbc:h2:mem:ci;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
      DATABASE_USERNAME: sa
      DATABASE_PASSWORD: ""
      SPRING_DATASOURCE_URL: "jdbc:h2:mem:ci;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.H2Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      JWT_SECRET: "ci-only-dummy-secret-0123456789012345678901234567890123456789"
      JWT_EXPIRATION: "3600000"
      PAYFAST_MERCHANT_ID: "10000100"
      PAYFAST_MERCHANT_KEY: "ci-dummy-key"
      PAYFAST_PASSPHRASE: "ci-dummy-passphrase"
      PAYFAST_SANDBOX: "true"
      PAYFAST_RETURN_URL: "http://localhost:3000/payment/success"
      PAYFAST_CANCEL_URL: "http://localhost:3000/payment/cancel"
      PAYFAST_NOTIFY_URL: "http://localhost:8081/api/payments/notify"
      FRONTEND_URL: "http://localhost:3000"
      PLATFORM_COMMISSION: "0.08"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests and package backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"
      REACT_APP_API_URL: "http://localhost:8081"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand

      - name: Build frontend
        run: npm run build