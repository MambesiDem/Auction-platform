spring.application.name=Action.api
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
payfast.merchant-id=${PAYFAST_MERCHANT_ID}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY}
payfast.passphrase=${PAYFAST_PASSPHRASE}
payfast.sandbox=${PAYFAST_SANDBOX:true}
payfast.return-url=${PAYFAST_RETURN_URL}
payfast.cancel-url=${PAYFAST_CANCEL_URL}
payfast.notify-url=${PAYFAST_NOTIFY_URL}
platform.commission=${PLATFORM_COMMISSION:0.05}
server.port=${PORT:8081}
frontend.url=${FRONTEND_URL:http://localhost:3000}
app.base-url=${APP_BASE_URL:}
auction.extension.threshold-minutes=${AUCTION_EXTENSION_THRESHOLD_MINUTES:5}
auction.extension.extension-minutes=${AUCTION_EXTENSION_EXTENSION_MINUTES:5}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.name=ConnSB
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.test-email-override=${TEST_EMAIL_OVERRIDE:}