spring.application.name=Action.api
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
payfast.merchant-id=${PAYFAST_MERCHANT_ID}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY}
payfast.passphrase=${PAYFAST_PASSPHRASE}
payfast.sandbox=${PAYFAST_SANDBOX:true}
payfast.return-url=${PAYFAST_RETURN_URL}
payfast.cancel-url=${PAYFAST_CANCEL_URL}
payfast.notify-url=${PAYFAST_NOTIFY_URL}
platform.commission=${PLATFORM_COMMISSION:0.05}
server.port=${PORT:8081}
frontend.url=${FRONTEND_URL:http://localhost:3000}