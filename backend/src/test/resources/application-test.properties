# Tests use an isolated in-memory database, never Aiven.
spring.datasource.url=jdbc:h2:mem:connsb_tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy credentials for tests only.
jwt.secret=test-only-secret-0123456789012345678901234567890123456789
jwt.expiration=3600000

payfast.merchant-id=10000100
payfast.merchant-key=test-only-key
payfast.passphrase=test-only-passphrase
payfast.sandbox=true
payfast.return-url=http://localhost:3000/payment/success
payfast.cancel-url=http://localhost:3000/payment/cancel
payfast.notify-url=http://localhost:8081/api/payments/notify

frontend.url=http://localhost:3000
app.frontend-url=http://localhost:3000
platform.commission=0.08

# No real email credentials during tests.
spring.mail.username=
spring.mail.password=